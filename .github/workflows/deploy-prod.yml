name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to deploy (main, prod, or tag)'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.example.com

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Deploy to production
        env:
          PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
        run: |
          # Replace with your deploy command, for example:
          # npx vercel deploy --prebuilt --prod --token "$PROD_DEPLOY_TOKEN"
          echo "Deploy production placeholder"
