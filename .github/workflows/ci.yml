name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Replace with your package manager command.
          npm ci

      - name: Lint
        run: |
          # Replace/extend with your lint checks.
          npm run lint --if-present

      - name: Test
        run: |
          # Replace/extend with your test command.
          npm test --if-present

      - name: Build
        run: |
          # Replace with your build command.
          npm run build --if-present
